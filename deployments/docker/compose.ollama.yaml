services:
  enterprise-orchestrator:
    environment:
      EOA_OLLAMA_URL: http://ollama:11434
      EOA_OLLAMA_MODEL: llama3:8b
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.3.14
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama-models:
